(function () {
  var q = new URLSearchParams(location.search);
  function dien(id, gt) {
    var t = document.getElementById(id), ke = document.getElementById(id + "-ke"), nhan = document.getElementById(id + "-nhan");
    if (!t || !ke) return;
    try {                                   /* chữ / dòng kẻ bắt đầu ngay sau nhãn, theo bề rộng thật của phông */
      var b = nhan.getBBox(), x = b.x + b.width + 1.6;
      ke.setAttribute("x1", x.toFixed(2)); t.setAttribute("x", (x + 0.4).toFixed(2));
    } catch (e) { /* giữ vị trí mặc định */ }
    if (!gt) return;
    t.textContent = gt;
    ke.style.display = "none";
    var rong = parseFloat(ke.getAttribute("x2")) - parseFloat(t.getAttribute("x"));
    try {
      if (t.getComputedTextLength() > rong) { t.setAttribute("textLength", rong.toFixed(2)); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
    } catch (e) { /* bỏ qua */ }
  }
  function lam() { dien("tt-don-vi", q.get("don_vi")); dien("tt-gvhd", q.get("gvhd")); dien("tt-nguoi", q.get("nguoi")); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(lam); else lam();
})();
</script>
</body></html>
